<div id="root"></div>
<script type="text/babel">
const { Input, Checkbox, Switch } = window.OddlyYoursDesignSystem_961bec;
function Demo(){
  const [c,setC]=React.useState(true);
  const [s,setS]=React.useState(false);
  return (
    <div style={{display:'flex',flexDirection:'column',gap:'18px'}}>
      <Input label="Email" placeholder="you@example.com" />
      <Input label="Coupon" error="That code sounds made up" />
      <Checkbox checked={c} onChange={setC} label="I promise to be a little odd" />
      <Switch checked={s} onChange={setS} label="Weird mode" />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
