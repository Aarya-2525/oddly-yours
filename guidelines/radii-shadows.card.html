<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;box-sizing:border-box;background:var(--surface-page);display:flex;gap:24px;font-family:var(--font-body);font-size:12px;font-weight:600;color:var(--text-primary)}.box{width:100px;height:100px;background:var(--color-splash-blue);border:2.5px solid var(--color-almost-ink);display:flex;align-items:center;justify-content:center;text-align:center}</style>
<div class="box" style="border-radius:var(--radius-sm)">radius-sm 10px</div>
<div class="box" style="border-radius:var(--radius-md)">radius-md 18px</div>
<div class="box" style="border-radius:var(--radius-lg)">radius-lg 28px</div>
<div class="box" style="border-radius:var(--radius-md);box-shadow:var(--shadow-card);background:var(--color-sunshine-yellow)">hard shadow</div>
